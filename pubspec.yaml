name: ar_fashion_app
description: "오프라인 패션 매장용 AR 쇼핑 앱 MVP (Flutter Frontend)"
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # 상태 관리 - Wishlist, AR Session, User 등 전역 상태 관리용
  provider: ^6.1.2

  # 화면 라우팅 - 추후 API/Unity 연동 시에도 라우트 구조를 그대로 재사용 가능
  go_router: ^14.2.0

  # 고유 ID 생성 (Mock Product / AR Session id 생성용)
  uuid: ^4.4.0

  # 날짜/시간 포맷 (AR 세션 duration 표시 등)
  intl: ^0.19.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
